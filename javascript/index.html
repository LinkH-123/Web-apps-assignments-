<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Dynamic Greeting based on the time of day -->
    <h3> Example 1: Dynamic Greeting</h3>
    <div id="greetingOutput"></div>

    <button onclick="setButtonText()">Click Me For Time</button>
    <div id="buttonClickText"></div>

    <!-- Example 4: Sum of Two Numbers -->
    <h3>Example 4: Find Sum</h3>
    <div>
        <label for="number1">Number 1:</label>
        <input type="number" id="number1" placeholder="Enter first number">
    </div>
    <br>
    <div>
        <label for="number2">Number 2:</label>
        <input type="number" id="number2" placeholder="Enter second number">
    </div>
    <br>
    <button onclick="findSum()">Find Sum</button>

    <h4>Result: <span id="sumOutput"></span></h4>

    <h3>Example 5: JavaScript string. Click the "Try it" button to get length of the text in the text field.</h3>
    <div>
        <label for="entry"></label>
        <input type="text" id="entry">
    </div>
    <br>
    <button onclick="getStringLength()">Try it</button>
    <h4>Length of the text: <span id="stringLengthOutput"></span></h4>

    <h3>Example 6: Toggle Password Display</h3>
    <div>
        <label for="password"></label>
        <input type="password" id="Password" placeholder="Enter your password">
    </div>
    <br>
    <input type="checkbox" id="showPassword" onclick="togglePassword()">
    <label for="showPassword">Show Password</label>

    <script src="script.js"></script>
</body>
</html>
